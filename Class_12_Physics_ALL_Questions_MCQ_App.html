GH' Indicate the logic gate for which the above statement in ture :–","o":["AND","OR","NOR","NAND"],"a":4,"code":"SC0233","chapter":"Semiconductor and Digital Electronics","exercise":"Exercise III - Analytical Questions"},{"n":27,"q":"27. The diagram of a logic circuit is given below. The output of the circuit is represented by :– output W X W Y","o":["W. (X + Y)","X. (X.Y)","W + (X + Y)","W + (X.Y)"],"a":4,"code":"SC0234","chapter":"Semiconductor and Digital Electronics","exercise":"Exercise III - Analytical Questions"},{"n":28,"q":"28. The following configuration of gates is equivalent to:- A B Y","o":["NAND","OR","XOR","NOR"],"a":3,"code":"SC0235","chapter":"Semiconductor and Digital Electronics","exercise":"Exercise III - Analytical Questions"},{"n":29,"q":"29. The combination of the gates shown represents:– Y A B","o":["AND gate","OR gate","NAND gate","NOR gate"],"a":1,"code":"SC0236","chapter":"Semiconductor and Digital Electronics","exercise":"Exercise III - Analytical Questions"},{"n":30,"q":"30. The figure shown a logic circuit two inputs A and B and the output C. The voltage wave forms across A, B and C are as given. The logic circuit gate is: 0 t1 C B A t2 t3 t4 t5 t6","o":["AND gate","NAND gate","OR gate","NOR gate"],"a":3,"code":"SC0144","chapter":"Semiconductor and Digital Electronics","exercise":"Exercise III - Analytical Questions"}],"chapters":["Electrostatics","Capacitor","Current Electricity","Magnetic effect of current & Magnetism","Electromagnetic Induction (EMI)","Alternating Current (AC)","Electromagnetic Waves","Ray Optics And Optical Instruments","Wave Optics","Modern Physics-I","Modern Physics-II","Modern Physics-III","Semiconductor and Digital Electronics"]};let pool=[],idx=0,score=0,answered=false;const chapter=document.getElementById('chapter'),exercise=document.getElementById('exercise'),search=document.getElementById('search'),quiz=document.getElementById('quiz');
[...new Set(DATA.chapters)].forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;chapter.appendChild(o)});
function filtered(){let c=chapter.value,e=exercise.value,s=search.value.trim().toLowerCase();return DATA.questions.filter(q=>(c==='all'||q.chapter===c)&&(e==='all'||q.exercise===e)&&(!s||q.q.toLowerCase().includes(s)||q.o.some(x=>x.toLowerCase().includes(s))))}
function refreshCount(){document.getElementById('count').textContent=filtered().length+' questions available';}function render(){if(!pool.length){quiz.innerHTML='<div class="small">No questions match these filters.</div>';return}let q=pool[idx];answered=false;document.getElementById('progress').style.width=((idx+1)/pool.length*100)+'%';document.getElementById('score').textContent='Score: '+score;quiz.innerHTML='<span class="tag">'+esc(q.chapter)+' • '+esc(q.exercise)+'</span><div class="q"><b>Q'+q.n+'.</b> '+esc(q.q)+'</div><div id="opts"></div><div class="actions"><button class="secondary" id="skip">Skip</button><button class="primary" id="next">Next Question</button></div>';let box=document.getElementById('opts');q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>answer(i,b);box.appendChild(b)});document.getElementById('next').onclick=next;document.getElementById('skip').onclick=next}
function answer(i,b){if(answered)return;answered=true;let q=pool[idx];[...document.querySelectorAll('.opt')].forEach((x,k)=>{x.disabled=true;if(k===q.a-1)x.classList.add('correct')});if(i===q.a-1)score++;else b.classList.add('wrong');document.getElementById('score').textContent='Score: '+score}
function next(){if(idx<pool.length-1){idx++;render()}else finish()}
function finish(){document.getElementById('progress').style.width='100%';quiz.innerHTML='<div class="result"><h2>🎉 Quiz Complete!</h2><p>You scored <b>'+score+'</b> out of <b>'+pool.length+'</b>.</p><p class="small">Accuracy: '+Math.round(score/pool.length*100)+'%</p><div class="actions"><button class="primary" id="again">Try Again</button></div></div>';document.getElementById('again').onclick=startQuiz}
function startQuiz(){pool=filtered().slice();idx=0;score=0;render()}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('start').onclick=startQuiz;document.getElementById('random').onclick=()=>{pool=filtered();if(!pool.length)return;idx=Math.floor(Math.random()*pool.length);score=0;render()};[chapter,exercise,search].forEach(x=>x.addEventListener('input',refreshCount));refreshCount();
